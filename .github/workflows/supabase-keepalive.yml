# Latido de Supabase: el plan gratuito pausa el proyecto tras 7 días sin actividad. Cada 3 días
# llama a la función public.keepalive() (supabase/migrations/20261113000000_keepalive.sql), que
# hace una consulta real a Postgres. Si falla, la ejecución sale en rojo y GitHub avisa por correo.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions): SUPABASE_URL y
# SUPABASE_ANON_KEY, los mismos valores públicos que usa la web.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Llamar a keepalive()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
